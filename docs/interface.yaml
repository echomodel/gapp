# The 4.0.0 interface, in a form a test can read. INTERFACE.md is the same
# list for people. tests/unit/test_interface.py compares the real CLI and
# MCP server to this file, and this file to INTERFACE.md.
#
# args:    positional arguments in order; <x> required, [x] optional.
# options: long option names. Every command also takes --json.
# one:     true when the command is about one deployment, and so takes
#          --deployment / -d.
# runs:    true when the command starts a run in GitHub Actions, and so
#          takes --no-watch.

commands:
  project setup: {args: ["<project>"]}

  add:
    args: ["[name]"]
    options: [--project, --repo, --ref, --copy-of]
  upgrade: {one: true}
  rename: {args: ["<old>", "<new>"]}
  remove: {args: ["<name>"]}
  list: {}
  show: {one: true}

  set: {args: ["<key>", "<value>"], one: true}
  unset: {args: ["<key>"], one: true}
  apis add: {args: ["<api>"], one: true}
  apis remove: {args: ["<api>"], one: true}
  env set:
    args: ["<name>", "[value]"]
    options: [--secret, --generate, --data-path]
    one: true
  env unset: {args: ["<name>"], one: true}
  apply: {args: ["<file>"], options: [--dry-run], one: true}

  deploy:
    options: [--dry-run, --rebuild, --replace-domain, --upgrade]
    one: true
  status: {one: true}
  secrets list: {one: true}
  secrets set: {args: ["<name>"], options: [--from-stdin], one: true}
  secrets get: {args: ["<name>"], options: [--plaintext], one: true}

  deployments list: {options: [--name, --repo, --project, --below, --limit]}
  deployments scan: {options: [--project]}

  ci init: {}
  ci projects connect: {args: ["<project>"]}
  ci projects list: {}
  ci deploy: {options: [--upgrade], one: true, runs: true}
  ci status: {options: [--live], one: true}
  ci sources add: {args: ["<owner>"]}
  ci sources remove: {args: ["<owner>"]}
  ci sources list: {}

  fleet: {}
  fleet use: {args: ["<target>"], options: [--create]}
  fleet export: {args: ["[file]"]}
  fleet import: {args: ["<file>"]}

  config profile list: {}
  config profile use: {args: ["<name>"]}
  config profile add: {args: ["<name>"]}
  config profile remove: {args: ["<name>"]}
  config profile rename: {args: ["<old>", "<new>"]}
  config account: {args: ["[email]"]}

# Commands a workflow runs on a runner. People never type them, so they
# are not in INTERFACE.md's tables; their shape is fixed all the same.
runner:
  prefix: ci runner

mcp_tools:
  - gapp_project_setup
  - gapp_add
  - gapp_upgrade
  - gapp_rename
  - gapp_remove
  - gapp_list
  - gapp_show
  - gapp_set
  - gapp_unset
  - gapp_apis
  - gapp_env_set
  - gapp_env_unset
  - gapp_apply
  - gapp_deploy
  - gapp_status
  - gapp_secrets_list
  - gapp_secrets_get
  - gapp_deployments_list
  - gapp_deployments_scan
  - gapp_ci_init
  - gapp_ci_projects
  - gapp_ci_deploy
  - gapp_ci_status
  - gapp_ci_sources
  - gapp_fleet
  - gapp_fleet_use
  - gapp_fleet_export
  - gapp_fleet_import
