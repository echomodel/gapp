# Reports what is live for one deployment of this fleet, on a runner.
# Installed by `gapp ci init`; gapp owns this file, so do not edit it.
# `gapp ci status --live` starts it. The first job reads the deployment's
# project and gapp version from gapp.yaml; the second runs in the GitHub
# Environment named after the project, signs in as a deploy does, and runs
# `gapp ci runner status <deployment>`, which prints the answer as one line
# the command that asked reads. Nothing is written anywhere.

name: Status of a gapp deployment
run-name: Status ${{ inputs.deployment }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Set by gapp to find the run it started (it ends the run name); leave empty when starting one by hand
        required: false
        default: ''
        type: string
      deployment:
        description: The deployment to ask about (a name under deployments in gapp.yaml)
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: Look up the deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project: ${{ steps.definition.outputs.project }}
      gapp_ref: ${{ steps.definition.outputs.gapp_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gapp.yaml
          sparse-checkout-cone-mode: false

      - name: Read the definition
        id: definition
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          FLEET_FILE: gapp.yaml
        run: |
          set -euo pipefail
          # The Go yq pre-installed on GitHub's Ubuntu runners. strenv() reads
          # the input from the environment, so it is never interpolated here.
          if [ ! -f "$FLEET_FILE" ]; then
            echo "gapp-status: this repo has no $FLEET_FILE, so it holds no fleet. Keep your fleet here with: gapp fleet use $GITHUB_REPOSITORY"
            exit 1
          fi
          format="$(yq '.format // ""' "$FLEET_FILE")"
          if [ "$format" != "1" ]; then
            echo "gapp-status: $FLEET_FILE is in format '${format:-none}', and this workflow reads format 1. Install the workflows of the gapp that wrote it: gapp ci init"
            exit 1
          fi
          if [ "$(yq '.deployments // {} | has(strenv(DEPLOYMENT))' "$FLEET_FILE")" != "true" ]; then
            echo "gapp-status: '$DEPLOYMENT' is not a deployment in this fleet. Define it first: gapp add $DEPLOYMENT --project <project> --repo <owner>/<repo>"
            exit 1
          fi
          definition='.deployments[strenv(DEPLOYMENT)]'
          version="$(yq "$definition | .gapp // \"\"" "$FLEET_FILE")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "gapp-status: '$DEPLOYMENT' names gapp '${version:-none}', which is not a gapp version."
            exit 1
          fi
          # These workflows hand gapp the fleet file and a command (CONTRIBUTING,
          # "The runner hand-off"); a gapp older than the minimum reads them
          # differently, so it is refused here, before anything is installed.
          minimum="__GAPP_RUNNER_MIN__"
          vkey() {
            [[ "$1" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(rc([0-9]+))?$ ]] || return 1
            printf '%06d%06d%06d%06d' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}" "${BASH_REMATCH[5]:-999999}"
          }
          if [[ "$(vkey "$version")" < "$(vkey "$minimum")" ]]; then
            echo "gapp-status: '$DEPLOYMENT' is defined with gapp $version, and these workflows need $minimum or later, so it was not asked. Upgrade it first: gapp upgrade --deployment $DEPLOYMENT, then gapp ci deploy --deployment $DEPLOYMENT --upgrade"
            exit 1
          fi
          {
            echo "project=$(yq "$definition | .project // \"\"" "$FLEET_FILE")"
            echo "gapp_ref=v$version"
          } >> "$GITHUB_OUTPUT"

  status:
    name: Ask the project
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.project }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the deploy identity
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.project }}
          WIF_PROVIDER: ${{ vars.GAPP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GAPP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="GAPP_WIF_PROVIDER"
          [ -n "$DEPLOY_SA" ] || missing="${missing:+$missing and }GAPP_DEPLOY_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "gapp-status: the Environment '$ENVIRONMENT' of this repo has no $missing, so this run cannot sign in to Google Cloud. Run: gapp ci projects connect $ENVIRONMENT"
            exit 1
          fi

      - name: Check out the fleet
        uses: actions/checkout@v4
        with:
          path: fleet
          sparse-checkout: gapp.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GAPP_WIF_PROVIDER }}
          service_account: ${{ vars.GAPP_DEPLOY_SERVICE_ACCOUNT }}

      # The domain's state is read with `gcloud beta run domain-mappings`.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      # What is live is read from the deployment's Terraform outputs.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install gapp
        env:
          GAPP_REF: ${{ needs.resolve.outputs.gapp_ref }}
        run: pip install --quiet "gapp @ git+https://github.com/__GAPP_REPO__.git@${GAPP_REF}"

      - name: Ask gapp
        env:
          GAPP_FLEET: ${{ github.workspace }}/fleet/gapp.yaml
          DEPLOYMENT: ${{ inputs.deployment }}
        run: gapp ci runner status "$DEPLOYMENT"
