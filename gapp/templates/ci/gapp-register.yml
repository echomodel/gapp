# Registers a solution for CI deploys by writing its entry into
# gapp/solutions.yaml. Installed and kept current by `gapp ci init`; gapp
# owns this file, so do not edit it. `gapp ci setup` dispatches it from any
# machine that can dispatch workflows here; no gcloud and no GitHub API
# write are needed on that machine, because this run does the write with
# its own token.
#
# Refuses when: the project has no Environment in this repository (`gapp ci
# project setup <project>` records it); the solution repo's owner is not
# listed in the repository variable GAPP_ALLOWED_SOURCES (`gapp ci sources
# add <owner>`); the solution repo is not readable with the run's token and
# the hosting app's credential is not present; or the solution is already
# registered on a different project.
#
# Every outcome is reported as a structured result the operator's command
# prints verbatim: a line `gapp-register: result=<code>` (added, updated,
# unchanged, or a refusal code) followed by one line of plain words.
# Inputs reach the shell through `env:` only, never interpolated into a
# `run:` script. The write uses the file's current SHA, so two runs that
# race fail cleanly instead of overwriting each other.

name: Register a gapp solution

on:
  workflow_dispatch:
    inputs:
      solution:
        description: Solution name (as in its gapp.yaml)
        required: true
        type: string
      solution-repo:
        description: Solution repo (owner/name)
        required: true
        type: string
      project:
        description: GCP project id (an Environment of this name must exist here)
        required: true
        type: string
      domain:
        description: Custom domain the deploy maps (optional; overrides gapp.yaml)
        required: false
        default: ''
        type: string
      gapp-ref:
        description: gapp ref to install on the runner (optional; the deploy workflow's own pin otherwise)
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  register:
    name: Register
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      SOLUTION: ${{ inputs.solution }}
      SOLUTION_REPO: ${{ inputs.solution-repo }}
      PROJECT: ${{ inputs.project }}
      DOMAIN: ${{ inputs.domain }}
      GAPP_REF: ${{ inputs.gapp-ref }}
      ALLOWED_SOURCES: ${{ vars.GAPP_ALLOWED_SOURCES }}
      APP_ID: ${{ vars.HOSTING_GITHUB_APP_ID }}
      APP_KEY_SET: ${{ secrets.HOSTING_GITHUB_APP_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
      DATA_FILE: gapp/solutions.yaml
    steps:
      - name: Check the inputs
        run: |
          set -euo pipefail
          refuse() { echo "gapp-register: result=$1"; echo "gapp-register: $2"; exit 1; }
          [[ "$SOLUTION" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || refuse invalid-input "'$SOLUTION' is not a valid solution name (lowercase letters, digits and hyphens)."
          [[ "$SOLUTION_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || refuse invalid-input "solution repo '$SOLUTION_REPO' is not of the form owner/name."
          [[ "$PROJECT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || refuse invalid-input "'$PROJECT' is not a GCP project id."
          [[ "$DOMAIN" =~ ^([a-z0-9-]+\.)*[a-z0-9-]*$ ]] || refuse invalid-input "domain '$DOMAIN' is not a host name."
          [[ "$GAPP_REF" =~ ^[A-Za-z0-9._/-]*$ ]] || refuse invalid-input "gapp ref '$GAPP_REF' is not a git ref."
          owner="${SOLUTION_REPO%%/*}"
          allowed=no
          if [ -n "$ALLOWED_SOURCES" ]; then
            IFS=',' read -ra owners <<< "$ALLOWED_SOURCES"
            for candidate in "${owners[@]}"; do
              candidate="${candidate// /}"
              if [ "${candidate,,}" = "${owner,,}" ]; then allowed=yes; fi
            done
          fi
          [ "$allowed" = yes ] || refuse source-owner-not-allowed "Source repos owned by $owner are not allowed to deploy through this CI repo; allow the owner with: gapp ci sources add $owner"
          echo "gapp-register: inputs accepted for '$SOLUTION' ($SOLUTION_REPO) on project '$PROJECT'."

      - name: Check the project's Environment
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/$PROJECT" --silent 2>/dev/null; then
            echo "gapp-register: result=project-not-trusted"
            echo "gapp-register: This CI repo is not yet trusted to deploy to GCP project $PROJECT (no Environment named '$PROJECT' here). Run: gapp ci project setup $PROJECT"
            exit 1
          fi
          echo "gapp-register: Environment '$PROJECT' exists."

      - name: Check the solution repo is reachable
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$SOLUTION_REPO" --jq .private 2>/dev/null || echo unreadable)"
          if [ "$visibility" = "false" ]; then
            echo "gapp-register: $SOLUTION_REPO is public."
          elif [ -z "$APP_ID" ] || [ "$APP_KEY_SET" != "true" ]; then
            echo "gapp-register: result=repo-unreachable"
            echo "gapp-register: $SOLUTION_REPO is not readable with this run's token (private, or it does not exist), and the hosting app's HOSTING_GITHUB_APP_ID variable and HOSTING_GITHUB_APP_PRIVATE_KEY secret are not both set in this CI repo. For a private repo, store them (see docs/CI.md, Private solution repos); otherwise check the repo name."
            exit 1
          else
            echo "gapp-register: $SOLUTION_REPO is private; the hosting app's credential is present, and the first deploy verifies that the app reaches the repo."
          fi

      - name: Write the entry
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/contents/$DATA_FILE"
          if ! gh api "$endpoint" > entry.json 2>/dev/null; then
            echo "gapp-register: result=data-file-missing"
            echo "gapp-register: $DATA_FILE does not exist in this CI repo; gapp ci init installs it."
            exit 1
          fi
          sha="$(yq -p=json -oy '.sha' entry.json)"
          yq -p=json -oy '.content' entry.json | base64 -d > current.yaml
          cp current.yaml solutions.yaml
          existing="$(yq '.solutions[] | select(.name == strenv(SOLUTION)) | .project' solutions.yaml)"
          if [ -n "$existing" ] && [ "$existing" != "$PROJECT" ]; then
            echo "gapp-register: result=conflict"
            echo "gapp-register: '$SOLUTION' is already registered on project '$existing'. A solution deploys to one project per CI repo; remove its entry from $DATA_FILE first to move it."
            exit 1
          fi
          yq -i '
            .solutions = ((.solutions // []) | map(select(.name != strenv(SOLUTION))))
              + [{"name": strenv(SOLUTION), "repo": strenv(SOLUTION_REPO), "project": strenv(PROJECT),
                  "domain": strenv(DOMAIN), "gapp_ref": strenv(GAPP_REF)}]
            | .solutions[] |= with_entries(select(.value != ""))
            | .solutions |= sort_by(.name)
          ' solutions.yaml
          if cmp -s current.yaml solutions.yaml; then
            echo "gapp-register: result=unchanged"
            echo "gapp-register: '$SOLUTION' is already registered with these values; nothing to write."
            echo "unchanged: $SOLUTION on $PROJECT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          action=updated
          [ -z "$existing" ] && action=added
          if ! gh api -X PUT "$endpoint" --silent \
               -f message="Register $SOLUTION on $PROJECT" \
               -f content="$(base64 -w0 solutions.yaml)" \
               -f sha="$sha" 2> put.err; then
            echo "gapp-register: result=write-rejected"
            echo "gapp-register: the write to $DATA_FILE was rejected by GitHub. Either the file changed during this run (dispatch again) or a rule on the default branch blocks this workflow's token (give the workflow a bypass, or register through a pull request)."
            exit 1
          fi
          echo "gapp-register: result=$action"
          echo "gapp-register: $action '$SOLUTION' -> $SOLUTION_REPO on project '$PROJECT'${DOMAIN:+, domain $DOMAIN}${GAPP_REF:+, gapp ref $GAPP_REF}."
          echo "$action: $SOLUTION -> $SOLUTION_REPO on $PROJECT${DOMAIN:+, domain $DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
