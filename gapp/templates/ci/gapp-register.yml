# Writes a deployment into gapp/deployments.yaml of this fleet repo.
# Installed and kept current by `gapp ci init`; gapp owns this file, so do
# not edit it. `gapp ci setup` and `gapp ci rename` dispatch it from any
# machine that can dispatch workflows here; no gcloud and no GitHub API
# write are needed on that machine, because this run does the write with
# its own token, running the same gapp code the operator's command ran.
#
# Refuses when: the project has no Environment in this repository (`gapp ci
# project setup <project>` records it); the deployed repo's owner is not
# listed in the repository variable GAPP_ALLOWED_SOURCES (`gapp ci sources
# add <owner>`); the repo is not readable with the run's token and the
# hosting app's credential is not present; the name is taken by another
# repo or project; or the repo is already deployed under another name.
#
# Every outcome is reported as a structured result the operator's command
# prints: a line `gapp-register: result=<code>` (added, updated, unchanged,
# renamed, or a refusal code) followed by one line of plain words. Inputs
# reach the command through `env:` only, never interpolated into a `run:`
# script. The write uses the file's current SHA, so two runs that race fail
# cleanly instead of overwriting each other.

name: Register a gapp deployment
run-name: Register ${{ inputs.name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: set (add or update), copy (a new deployment from an existing one) or rename
        required: true
        default: set
        type: string
      name:
        description: Deployment name
        required: true
        type: string
      repo:
        description: Deployed repo (owner/name); set only
        required: false
        default: ''
        type: string
      project:
        description: GCP project id (an Environment of this name must exist here); set, or copy to another project
        required: false
        default: ''
        type: string
      changes:
        description: JSON object of gapp.yaml keys to set on the entry (null removes a key)
        required: false
        default: '{}'
        type: string
      source:
        description: copy - the deployment to copy; rename - the deployment's current name
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  register:
    name: Register
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      OPERATION: ${{ inputs.operation }}
      NAME: ${{ inputs.name }}
      REPO: ${{ inputs.repo }}
      PROJECT: ${{ inputs.project }}
      CHANGES: ${{ inputs.changes }}
      SOURCE: ${{ inputs.source }}
      ALLOWED_SOURCES: ${{ vars.GAPP_ALLOWED_SOURCES }}
      APP_ID: ${{ vars.HOSTING_GITHUB_APP_ID }}
      APP_KEY_SET: ${{ secrets.HOSTING_GITHUB_APP_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
      FLEET_REPO: ${{ github.repository }}
    steps:
      - name: Install gapp
        run: pip install --quiet "gapp @ git+https://github.com/__GAPP_REPO__.git@__GAPP_REF__"

      - name: Write the deployment
        run: gapp ci runner register
