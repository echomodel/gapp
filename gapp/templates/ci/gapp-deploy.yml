# Generic deploy workflow for every deployment in this fleet repo.
# Installed and kept current by `gapp ci init`; gapp owns this file, so do
# not edit it. Dispatch it with a deployment name (`gapp ci deploy <name>`,
# or "Run workflow" on the Actions tab): the first job reads the
# deployment's entry from gapp/deployments.yaml, and the second runs in the
# GitHub Environment named after the entry's project and calls gapp's
# reusable deploy workflow with the entry's repo, id and gapp.yaml keys.
# The Environment holds the project's deploy identity (GAPP_WIF_PROVIDER
# and GAPP_DEPLOY_SERVICE_ACCOUNT); a private repo is cloned with the
# hosting app whose id and key are this repository's HOSTING_GITHUB_APP_ID
# variable and HOSTING_GITHUB_APP_PRIVATE_KEY secret.

name: Deploy a gapp deployment
run-name: Deploy ${{ inputs.deployment }} (${{ inputs.ref }}) ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Set by gapp to find the run this dispatch created (it ends the run name); leave empty when dispatching by hand
        required: false
        default: ''
        type: string
      deployment:
        description: Deployment to deploy (an entry in gapp/deployments.yaml)
        required: true
        type: string
      ref:
        description: Git ref of the deployed repo to deploy (commit, tag, or branch)
        required: false
        default: main
        type: string

permissions: {}

jobs:
  resolve:
    name: Look up the deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      repo: ${{ steps.entry.outputs.repo }}
      project: ${{ steps.entry.outputs.project }}
      id: ${{ steps.entry.outputs.id }}
      overlay: ${{ steps.entry.outputs.overlay }}
      app_id: ${{ steps.entry.outputs.app_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gapp/deployments.yaml
          sparse-checkout-cone-mode: false

      - name: Read the entry
        id: entry
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          APP_ID: ${{ vars.HOSTING_GITHUB_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          DATA_FILE: gapp/deployments.yaml
        run: |
          set -euo pipefail
          # The Go yq pre-installed on GitHub's Ubuntu runners. strenv() reads
          # the input from the environment, so it is never interpolated here.
          if [ "$(yq 'has(strenv(DEPLOYMENT))' "$DATA_FILE")" != "true" ]; then
            echo "gapp-deploy: '$DEPLOYMENT' is not a deployment in $DATA_FILE. Set it up first: gapp ci setup $DEPLOYMENT --repo <owner>/<repo> --project <project>"
            exit 1
          fi
          entry='.[strenv(DEPLOYMENT)]'
          repo="$(yq "$entry | .repo" "$DATA_FILE")"
          project="$(yq "$entry | .project" "$DATA_FILE")"
          id="$(yq "$entry | .id // strenv(DEPLOYMENT)" "$DATA_FILE")"
          # Every key but id, repo and project is a gapp.yaml key the deploy
          # merges over the repo's gapp.yaml; name is set to the id so gapp
          # keys every resource by it.
          overlay="$(yq -o=json -I=0 "$entry | . as \$e | del(.id, .repo, .project) | .name = (\$e.id // strenv(DEPLOYMENT))" "$DATA_FILE")"
          # The deploy job runs in the Environment named after the project; it
          # must exist here, or the job cannot authenticate to GCP.
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/$project" --silent 2>/dev/null; then
            echo "gapp-deploy: this fleet repo has no Environment named '$project', so the deploy cannot authenticate to GCP project $project. Run: gapp ci project setup $project"
            exit 1
          fi
          # A public repo is cloned with the run's own token. Anything the
          # token cannot read (private, or missing) needs the hosting app.
          app_id=""
          if [ "$(gh api "repos/$repo" --jq .private 2>/dev/null || echo unreadable)" != "false" ]; then
            if [ -z "$APP_ID" ]; then
              echo "gapp-deploy: $repo is not readable with the run's token (private, or it does not exist), and the hosting app's HOSTING_GITHUB_APP_ID variable is not set in this fleet repo. For a private repo, store HOSTING_GITHUB_APP_ID and HOSTING_GITHUB_APP_PRIVATE_KEY (docs/CI.md, Private repos); otherwise check the repo in $DATA_FILE."
              exit 1
            fi
            app_id="$APP_ID"
          fi
          {
            echo "repo=$repo"
            echo "project=$project"
            echo "id=$id"
            echo "overlay=$overlay"
            echo "app_id=$app_id"
          } >> "$GITHUB_OUTPUT"
          echo "gapp-deploy: $DEPLOYMENT -> $repo on project $project (id $id)"

  deploy:
    name: Deploy
    needs: resolve
    permissions:
      id-token: write
      contents: read
    uses: __GAPP_REPO__/.github/workflows/deploy.yml@__GAPP_REF__
    with:
      solution-repo: ${{ needs.resolve.outputs.repo }}
      ref: ${{ inputs.ref }}
      environment: ${{ needs.resolve.outputs.project }}
      gapp-repo: __GAPP_REPO__
      gapp-ref: __GAPP_REF__
      solution-name: ${{ needs.resolve.outputs.id }}
      overlay: ${{ needs.resolve.outputs.overlay }}
      solution-repo-app-id: ${{ needs.resolve.outputs.app_id }}
    secrets:
      solution-repo-app-private-key: ${{ secrets.HOSTING_GITHUB_APP_PRIVATE_KEY }}
