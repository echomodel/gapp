# Deploys one deployment of a fleet on a GitHub Actions runner.
#
# Called from the deploy workflow `gapp ci init` installs in a fleet repo
# (gapp/templates/ci/gapp-deploy.yml), which looks the deployment up in the
# fleet repo's gapp.yaml and passes what a job needs before gapp is
# installed: the app's repo and ref to check out, the project whose
# Environment holds the deploy identity, and the gapp version the
# deployment's definition names.
#
# The job checks out the fleet repo and the app's repo, installs that gapp,
# signs in to Google Cloud, and runs `gapp deploy --deployment <name> --json`
# in the app's checkout, the deploy a person runs from a clone. Everything
# it deploys comes from the definition. That command line is what must stay
# the same across gapp releases, so a definition written by an earlier gapp
# can still be deployed by it.

name: Deploy a gapp deployment

on:
  workflow_call:
    secrets:
      app-repo-key:
        description: >-
          Private key of the GitHub App that may read the app's repo. Needed
          only when that repo is private, together with `app-repo-app-id`.
          Used once per run for a one-hour, read-only token limited to that
          one repo.
        required: false
    inputs:
      deployment:
        description: The deployment's name in the fleet.
        required: true
        type: string
      upgrade:
        description: Apply a pending gapp upgrade. Refused when none is pending.
        required: false
        default: false
        type: boolean
      replace-domain:
        description: Let the deploy replace or remove the live custom domain. The old one stops serving.
        required: false
        default: false
        type: boolean
      app-repo:
        description: The app's repo (owner/name), from the deployment's definition.
        required: true
        type: string
      ref:
        description: The branch, tag or commit the definition builds; empty for the repo's default branch.
        required: false
        default: ''
        type: string
      environment:
        description: >-
          The GitHub Environment in the fleet repo that holds the project's
          deploy identity (GAPP_WIF_PROVIDER and GAPP_DEPLOY_SERVICE_ACCOUNT),
          named after the project. `gapp ci projects connect` records it.
        required: true
        type: string
      gapp-repo:
        description: Where gapp is installed from (owner/name).
        required: true
        type: string
      gapp-ref:
        description: The gapp version to install, as a tag. The one the deployment's definition names.
        required: true
        type: string
      app-repo-app-id:
        description: Id of the GitHub App that may read the app's repo; empty for a public repo.
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  deploy:
    name: Deploy ${{ inputs.deployment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      # A missing variable would fail the sign-in with a message about an
      # empty value; say what is missing and the command that records it.
      - name: Check the deploy identity
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          WIF_PROVIDER: ${{ vars.GAPP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GAPP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="GAPP_WIF_PROVIDER"
          [ -n "$DEPLOY_SA" ] || missing="${missing:+$missing and }GAPP_DEPLOY_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::The Environment '$ENVIRONMENT' of the fleet repo has no $missing, so this run cannot sign in to Google Cloud. Run: gapp ci projects connect $ENVIRONMENT"
            exit 1
          fi

      - name: Check out the fleet
        uses: actions/checkout@v4
        with:
          path: fleet
          sparse-checkout: gapp.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A private app repo: the run's own token can read only the fleet
      # repo, so mint one for that one repo, read-only, for an hour.
      - name: Check the app repo credential
        if: inputs.app-repo-app-id != ''
        id: app-repo
        env:
          APP_REPO_KEY: ${{ secrets.app-repo-key }}
          APP_REPO: ${{ inputs.app-repo }}
        run: |
          if [ -z "$APP_REPO_KEY" ]; then
            echo "::error::app-repo-app-id is set but the app-repo-key secret is empty. Pass both, or neither for a public repo."
            exit 1
          fi
          echo "owner=${APP_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${APP_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a read-only token for the app repo
        if: inputs.app-repo-app-id != ''
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-repo-app-id }}
          private-key: ${{ secrets.app-repo-key }}
          owner: ${{ steps.app-repo.outputs.owner }}
          repositories: ${{ steps.app-repo.outputs.name }}
          permission-contents: read

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app-repo }}
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          # The token is needed only for the clone.
          persist-credentials: false
          # Its own folder, beside the fleet's: a checkout's default path is the
          # workspace (`/home/runner/work/<caller>/<caller>/`), and
          # two checkouts cannot share it.
          path: app

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GAPP_WIF_PROVIDER }}
          service_account: ${{ vars.GAPP_DEPLOY_SERVICE_ACCOUNT }}

      # The beta component carries `gcloud beta run domain-mappings`, which
      # gapp uses for a fully managed Cloud Run domain mapping.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install gapp
        env:
          GAPP_REPO: ${{ inputs.gapp-repo }}
          GAPP_REF: ${{ inputs.gapp-ref }}
        run: pip install --quiet "gapp @ git+https://github.com/${GAPP_REPO}.git@${GAPP_REF}"

      - name: Deploy
        working-directory: app
        env:
          GAPP_FLEET: ${{ github.workspace }}/fleet/gapp.yaml
          DEPLOYMENT: ${{ inputs.deployment }}
          UPGRADE_FLAG: ${{ inputs.upgrade && '--upgrade' || '' }}
          REPLACE_FLAG: ${{ inputs.replace-domain && '--replace-domain' || '' }}
        run: |
          # gapp prints its result as JSON on stdout and everything else on
          # stderr. The line below is how `gapp ci deploy` reads the result
          # back from this log: result=, refused= or error=, and the exit code.
          set +e
          gapp deploy --deployment "$DEPLOYMENT" --json $UPGRADE_FLAG $REPLACE_FLAG > "$RUNNER_TEMP/gapp.json" 2> "$RUNNER_TEMP/gapp.err"
          code=$?
          set -e
          cat "$RUNNER_TEMP/gapp.err" >&2
          case "$code" in
            0) echo "gapp-deploy: result=$(jq -c . "$RUNNER_TEMP/gapp.json")" ;;
            2) echo "gapp-deploy: refused=$(jq -r .message "$RUNNER_TEMP/gapp.json" | tr -s '[:space:]' ' ' | sed 's/ *$//')" ;;
            *) echo "gapp-deploy: error=$(grep -m1 'Error: ' "$RUNNER_TEMP/gapp.err" | sed 's/^ *Error: //')" ;;
          esac
          exit "$code"
